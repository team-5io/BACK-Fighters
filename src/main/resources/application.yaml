spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 5iozoo_db로 연결, 한국 시간대 설정 추가 (기본값은 로컬 개발용, .env로 덮어쓰기 가능)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/5iozoo_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리, Hibernate는 엔티티-스키마 일치 여부만 검증
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    # 기존 스키마(테이블은 있지만 flyway 이력이 없는 상태)를 버전 1로 간주하고 시작
    baseline-on-migrate: true
    baseline-version: 1
    # 팀원마다 마이그레이션 버전 대역을 나눠 병렬 작업 시, 병합 순서와 무관하게 낮은 버전도 나중에 적용 가능
    out-of-order: true


jwt:
  # 토큰을 암호화할 때 쓰는 비밀키 (.env의 JWT_SECRET에서 로드, 기본값 없음 — 필수)
  secret: ${JWT_SECRET}
  # 액세스 토큰 만료 시간 (밀리초 단위, 기본값 3600000 = 1시간)
  access-token-validity-in-milliseconds: ${JWT_ACCESS_TOKEN_VALIDITY_IN_MILLISECONDS:3600000}